# Render Blueprint — free Docker web service.
# Docs: https://render.com/docs/blueprint-spec
#
# Push this repo, then in Render choose "New +" -> "Blueprint" and point it at
# the repo. Everything below is free; no paid add-ons are required.
#
# NO `databases:` BLOCK ON PURPOSE. Render's free Postgres is deleted 30 days
# after creation, not 30 days of inactivity — a 14-day grace period, then the
# data is gone. This blueprint used to provision one and wire DATABASE_URL to
# it, which put a dated database on a 30-day fuse.
#
# DATABASE_URL is now set by hand in the dashboard (a Neon pooled connection
# string) and marked `sync: false` so a blueprint re-apply cannot overwrite it
# or reintroduce the expiring database. The value is a live password, so it
# belongs in the dashboard and never in this file.
#
# This matters more than it looks: if DATABASE_URL is ever empty, settings.py
# silently falls back to SQLite inside the container, which is wiped on every
# redeploy. The site keeps working and loses all data. Check /healthz/ and the
# env var if registrations disappear after a deploy.

services:
  - type: web
    name: agrimarket
    runtime: docker
    plan: free
    # No `region` here on purpose. Render pins free instances to Oregon
    # (US-West); asking for another region puts the web service somewhere the
    # free Postgres is not, and Render's internal "dpg-..." database hostname
    # only resolves within its own region. The result is a deploy that dies
    # with "could not translate host name dpg-... to address", which reads
    # like a missing database rather than a region mismatch.
    healthCheckPath: /healthz/
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Optional; settings also auto-trust RENDER_EXTERNAL_HOSTNAME. The old
      # hostname is kept in the list so an older service still resolving does
      # not start returning 400s if it is ever brought back.
      - key: DJANGO_ALLOWED_HOSTS
        value: agri-marketplace-2uui.onrender.com,agrimarket.onrender.com
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: SEED_ON_BOOT
        value: "true"
      # Set this in the dashboard to a Neon pooled connection string, e.g.
      # postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      # Keep DB_CONN_MAX_AGE=0 alongside it: a pooled endpoint is a
      # transaction-mode proxy, and holding a connection open across it
      # produces intermittent "prepared statement does not exist" errors.
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"

      # Without these, notification emails carry no Brevo credentials and
      # nothing is sent. SITE_URL is not needed: settings.py derives it from
      # RENDER_EXTERNAL_HOSTNAME, which Render sets at boot.
      - key: DJANGO_EMAIL_BACKEND
        value: marketplace.email_backend.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Media storage. The container filesystem is ephemeral, so uploaded
      # listing photos and delivery proofs are lost on every redeploy until
      # USE_S3 is turned on. Set USE_S3=true and fill the AWS_* values once a
      # bucket exists (Cloudflare R2 and Backblaze B2 are S3-compatible: give
      # AWS_S3_ENDPOINT_URL the endpoint and AWS_S3_CUSTOM_DOMAIN the public
      # hostname). See docs/DEPLOYMENT.md section 6.
      - key: USE_S3
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      # Fill these in the Render dashboard after the first deploy.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.sambanova.ai/v1
      - key: AI_MODEL
        value: Meta-Llama-3.1-8B-Instruct
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional admin bootstrap (set once, then remove).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # No REDIS_URL: the app uses an in-process cache by default, free.

# The watchdog. Runs the health checks every five minutes and emails the
  # superuser only when something changes state, so a database that expires or
  # a migration that never applied announces itself instead of waiting for a
  # customer to complain.
  #
  # NOTE: --keepalive is deliberately NOT enabled here. It stops the free web
  # service sleeping, but it also occupies essentially your whole monthly
  # instance-hours allowance. Read docs/OPERATIONS.md before turning it on.
  #
  # A cron service is a *separate container* and does not inherit the web
  # service's environment. It therefore needs its own DJANGO_SECRET_KEY (or
  # settings.py refuses to start: DEBUG defaults to false when unset) and its
  # own DATABASE_URL. Expect to be prompted for BREVO_API_KEY twice.
  - type: cron
    name: health-watch
    runtime: docker
    # No `plan` key: Render rejects "free" for service type cron
    # ("services[1].plan free not a valid plan for service type cron").
    # Scheduled jobs are not billed like web services.
    schedule: "*/5 * * * *"
    dockerfilePath: ./Dockerfile
    # dockerCommand, not command: on a Docker-runtime service `command` is
    # ignored, the container falls back to the Dockerfile CMD (gunicorn), and
    # the job fails with a confusing "file not found" instead of running.
    dockerCommand: python manage.py check_services --exit-code
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      # The entrypoint migrates, collects static files and seeds the crop
      # catalogue on every start. That is right for the web service and waste
      # for a job that runs twelve times an hour.
      - key: SKIP_BOOT_TASKS
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      # No RENDER_EXTERNAL_HOSTNAME here (that is a web-service variable), so
      # the site_url check needs to be told. This must be the real hostname:
      # pointing it at the wrong one makes the watchdog report site_url as
      # broken while the site itself works fine.
      - key: SITE_URL
        value: https://agri-marketplace-2uui.onrender.com
      - key: DJANGO_EMAIL_BACKEND
        value: marketplace.email_backend.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # A cron job is a separate container and does not inherit the web
      # service's environment, so this needs setting independently. Left empty,
      # the watchdog reports a database failure that is not real.
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"
