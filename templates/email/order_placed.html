{% extends "email/_layout.html" %}
{% block body %}
<h1 style="margin:0 0 12px;font-size:18px;">New order</h1>
<p style="margin:0 0 16px;">
    {{ buyer_name }} has ordered <strong>{{ quantity|floatformat:2 }} {{ unit }}</strong> of
    <strong>{{ crop_name }}</strong> from you.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;">
    <tr><td style="padding:6px 0;color:#6b7a72;">Price per {{ unit }}</td><td align="right" style="padding:6px 0;">₹{{ price_per_unit|floatformat:2 }}</td></tr>
    <tr><td style="padding:6px 0;color:#6b7a72;">Order total</td><td align="right" style="padding:6px 0;font-weight:600;">₹{{ amount|floatformat:2 }}</td></tr>
</table>
<p style="margin:20px 0 0;">
    <a href="{{ order_url }}" style="display:inline-block;background:#1f7a3f;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:6px;font-weight:600;">See the order</a>
</p>
{% endblock %}
