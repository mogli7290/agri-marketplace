{% extends "email/_layout.html" %}
{% block body %}
<h1 style="margin:0 0 12px;font-size:18px;">Payment received</h1>
<p style="margin:0 0 16px;">
    Thanks — we have your payment for order <strong>#{{ order_id }}</strong>.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;">
    <tr><td style="padding:6px 0;color:#6b7a72;">Produce</td><td align="right" style="padding:6px 0;">{{ quantity|floatformat:2 }} {{ unit }} {{ crop_name }}</td></tr>
    <tr><td style="padding:6px 0;color:#6b7a72;">Seller</td><td align="right" style="padding:6px 0;">{{ farmer_name }}</td></tr>
    <tr><td style="padding:6px 0;color:#6b7a72;">Total paid</td><td align="right" style="padding:6px 0;font-weight:600;">₹{{ amount|floatformat:2 }}</td></tr>
</table>
<p style="margin:20px 0 0;">
    <a href="{{ order_url }}" style="display:inline-block;background:#1f7a3f;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:6px;font-weight:600;">Track your order</a>
</p>
{% endblock %}
