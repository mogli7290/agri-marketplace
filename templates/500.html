{% extends "base.html" %}
{% block title %}Something went wrong · {{ site_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
    <h1 class="h3 mt-3">Something went wrong on our side</h1>
    <p class="text-muted">Our team has been notified. Please try again in a moment.</p>
    <a href="/" class="btn btn-success">Return home</a>
</div>
{% endblock %}
