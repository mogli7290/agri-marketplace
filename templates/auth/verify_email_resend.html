{% extends "base.html" %}
{% block title %}Resend confirmation · {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 mb-3">Send a new confirmation link</h1>
                <p class="text-muted small">
                    Enter the address you registered with and we will send a fresh link.
                </p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success w-100">Email me a link</button>
                </form>
                <p class="small text-muted mt-3 mb-0">
                    Already confirmed? <a href="{% url 'marketplace:login' %}">Sign in</a>.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
